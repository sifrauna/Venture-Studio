<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EngineerDESK Venture Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='14' fill='%234254EE'/%3E%3Crect x='13' y='12' width='18' height='7' rx='3.5' fill='%23FFC94A'/%3E%3Crect x='13' y='20.5' width='12' height='7' rx='3.5' fill='%23fff'/%3E%3Crect x='13' y='29' width='18' height='7' rx='3.5' fill='%233ED6A5'/%3E%3Crect x='11' y='10' width='7.5' height='28' rx='3.75' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF0F4;--surface:#fff;--sunk:#F5F6F9;--line:#D9DEE7;--ink:#161B26;--ink2:#444F62;--mute:#66728A;
  --accent:#2740C8;--accent-ink:#fff;--soft:#E6EAFB;--ok:#0E7A4B;--warn:#8F5600;--bad:#B42336;
  --ok-bg:#E3F4EB;--warn-bg:#FBEFD9;--bad-bg:#FBE4E7;--r:10px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E121C;--surface:#171C2A;--sunk:#121726;--line:#29304A;--ink:#E8ECF5;--ink2:#B6BFD0;--mute:#8E99AF;
  --accent:#8DA2FF;--accent-ink:#0E121C;--soft:#222A4A;--ok:#4CC38A;--warn:#E3A650;--bad:#F27C8E;
  --ok-bg:#12301F;--warn-bg:#352708;--bad-bg:#381820;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121C;--surface:#171C2A;--sunk:#121726;--line:#29304A;--ink:#E8ECF5;--ink2:#B6BFD0;--mute:#8E99AF;
  --accent:#8DA2FF;--accent-ink:#0E121C;--soft:#222A4A;--ok:#4CC38A;--warn:#E3A650;--bad:#F27C8E;
  --ok-bg:#12301F;--warn-bg:#352708;--bad-bg:#381820;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line);background:none;border-top:0;border-left:0;border-right:0;text-align:left;width:100%}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.brand small{color:var(--mute);font-size:12px}
.nav{flex:1;overflow:auto;padding:12px 10px}
.nav h6{margin:14px 8px 6px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.nav h6:first-child{margin-top:0}
.nav button,.foot button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink2);text-align:left}
.nav button:hover,.foot button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"],.foot button[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:500}
.foot{border-top:1px solid var(--line);padding:10px}

.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{font-weight:600;white-space:nowrap}
.menu{display:none}
.search{flex:1;max-width:460px;margin-left:auto;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink)}
.search:focus-within{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sq{padding:8px}
main{flex:1;overflow:auto;padding:28px 24px 48px}
.wrap{max-width:1180px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:22px}
h1{margin:0;font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.head p{margin:6px 0 0;color:var(--ink2);max-width:60ch}
.acts{display:flex;gap:8px}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi span{display:block;color:var(--ink2);font-size:13px;line-height:1.3;min-height:34px}
.kpi b{display:block;font:500 28px/1.2 var(--mono);margin-top:6px}
.kpi.alert b{color:var(--bad)}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-bottom:24px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.stages div{padding:10px 14px;border-left:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--ink2)}
.stages div:first-child{border-left:0}
.stages b{font-family:var(--mono);font-weight:500;color:var(--ink)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .search{margin:0;max-width:260px;flex:1 1 200px}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 10px;display:grid;place-items:center;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.card p{margin:0;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.prog{height:6px;border-radius:9px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.row{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink2);background:var(--sunk);font-size:13px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--sunk)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:48px 20px;text-align:center}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 auto 18px;color:var(--ink2);max-width:46ch}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,14,24,.5)}
.dh,.df{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh{border-bottom:1px solid var(--line)}.dh h2{margin:0;font-size:18px;font-weight:600}
.df{border-top:1px solid var(--line);justify-content:flex-end}
.db{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.db label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:13px}
.db .full{grid-column:1/-1}
.db input,.db select,.db textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-weight:400}
.db input:focus,.db select:focus,.db textarea:focus{outline:0;border-color:var(--accent);background:var(--surface)}

.copilot{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--surface);border-left:1px solid var(--line);display:none;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.copilot.open{display:flex}
.copilot .dh{border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{padding:10px 12px;background:var(--soft);border-radius:8px;color:var(--ink2);font-size:13px}
.sug{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink2)}
.sug:hover{border-color:var(--accent);color:var(--ink)}
.me{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:12px 12px 2px 12px}
.prop{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.prop ul{margin:0;padding-left:18px;color:var(--ink2)}
.cf{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.cf input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;display:none}
.scrim{display:none}

@media (max-width:1100px){.kpis,.stages{grid-template-columns:repeat(3,1fr)}
  .kpi:nth-child(4),.stages div:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--line)}.stages div:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:272px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:30}
  .menu{display:inline-flex}.top{padding:10px 14px}main{padding:20px 14px 40px}
  .db{grid-template-columns:1fr}.search.g{display:none}}
@media (max-width:520px){.kpis,.stages{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(odd),.stages div:nth-child(odd){border-left:0}.kpi:nth-child(n+3),.stages div:nth-child(n+3){border-top:1px solid var(--line)}
  .kpi:nth-child(even),.stages div:nth-child(even){border-left:1px solid var(--line)}.kpi:nth-child(4),.stages div:nth-child(4){border-left:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== SKIN: glass + neumorphic + liquid glass + clay, Pixar palette ===== */
:root{
  --font-d:"Fredoka","Nunito",system-ui,sans-serif;--font-b:"Nunito",system-ui,sans-serif;
  --bg:#E8ECFB;--ink:#1E2340;--ink2:#464E74;--mute:#5C6489;--line:rgba(255,255,255,.75);--rowline:rgba(110,120,200,.2);
  --accent:#4A5BF2;--soft:rgba(91,108,255,.16);
  --ok:#0A7A55;--ok-bg:rgba(62,214,165,.3);--warn:#85500A;--warn-bg:rgba(255,201,74,.45);--bad:#B3243B;--bad-bg:rgba(255,122,107,.3);
  --glass-a:rgba(255,255,255,.74);--glass-b:rgba(255,255,255,.36);--dlg:rgba(250,251,255,.93);--hi:rgba(255,255,255,.95);
  --sh:rgba(70,80,170,.32);--neu-d:rgba(140,152,205,.5);--neu-l:rgba(255,255,255,.95);--field:#E6EAF8;--chip:rgba(255,255,255,.6);--hov:rgba(255,255,255,.45);
  --b1:rgba(255,201,74,.6);--b2:rgba(255,122,107,.45);--b3:rgba(62,214,165,.45);--b4:rgba(91,108,255,.45);--r:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10132A;--ink:#EEF0FF;--ink2:#C5CBEC;--mute:#9AA2CC;--line:rgba(255,255,255,.16);--rowline:rgba(255,255,255,.1);
  --accent:#97A4FF;--soft:rgba(151,164,255,.2);--ok:#5EE3B2;--ok-bg:rgba(62,214,165,.2);--warn:#FFC94A;--warn-bg:rgba(255,201,74,.2);--bad:#FF8E80;--bad-bg:rgba(255,122,107,.22);
  --glass-a:rgba(52,60,118,.62);--glass-b:rgba(30,35,80,.4);--dlg:rgba(26,31,66,.95);--hi:rgba(255,255,255,.2);
  --sh:rgba(0,0,10,.55);--neu-d:rgba(0,0,12,.6);--neu-l:rgba(130,140,230,.14);--field:#1A1F42;--chip:rgba(255,255,255,.1);--hov:rgba(255,255,255,.07);
  --b1:rgba(255,201,74,.18);--b2:rgba(255,122,107,.2);--b3:rgba(62,214,165,.16);--b4:rgba(91,108,255,.3)}}
:root[data-theme="dark"]{
  --bg:#10132A;--ink:#EEF0FF;--ink2:#C5CBEC;--mute:#9AA2CC;--line:rgba(255,255,255,.16);--rowline:rgba(255,255,255,.1);
  --accent:#97A4FF;--soft:rgba(151,164,255,.2);--ok:#5EE3B2;--ok-bg:rgba(62,214,165,.2);--warn:#FFC94A;--warn-bg:rgba(255,201,74,.2);--bad:#FF8E80;--bad-bg:rgba(255,122,107,.22);
  --glass-a:rgba(52,60,118,.62);--glass-b:rgba(30,35,80,.4);--dlg:rgba(26,31,66,.95);--hi:rgba(255,255,255,.2);
  --sh:rgba(0,0,10,.55);--neu-d:rgba(0,0,12,.6);--neu-l:rgba(130,140,230,.14);--field:#1A1F42;--chip:rgba(255,255,255,.1);--hov:rgba(255,255,255,.07);
  --b1:rgba(255,201,74,.18);--b2:rgba(255,122,107,.2);--b3:rgba(62,214,165,.16);--b4:rgba(91,108,255,.3)}
body{font-family:var(--font-b);font-size:15px;background:
  radial-gradient(560px 480px at 6% 8%,var(--b1),transparent 65%),radial-gradient(640px 560px at 94% 6%,var(--b2),transparent 65%),
  radial-gradient(760px 640px at 90% 96%,var(--b3),transparent 65%),radial-gradient(680px 600px at 8% 96%,var(--b4),transparent 65%),var(--bg);background-attachment:fixed}
h1,h2,h3,.crumb,.brand b,.kpi b,.btn{font-family:var(--font-d)}
h1{font-size:32px;font-weight:600}
.btn,.card,.kpi,.stages div,.seg button,.sug{--spring:cubic-bezier(.34,1.56,.64,1);transition:transform .25s var(--spring),box-shadow .25s,filter .2s,background .2s}

/* Glass shell (glassmorphism + liquid glass edge) */
.side,.top{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7)}
.side{border:0;border-right:1px solid var(--line);box-shadow:10px 0 40px -20px var(--sh),inset -1px 0 0 var(--hi)}
.top{border:0;border-bottom:1px solid var(--line);box-shadow:0 12px 30px -20px var(--sh),inset 0 -1px 0 var(--hi)}
.brand,.foot{border-color:var(--rowline)}
.mark{border-radius:50%;width:38px;height:38px;background:radial-gradient(circle at 30% 24%,#fff 0 7%,transparent 8%),linear-gradient(145deg,#8E9BFF,#4254EE);box-shadow:inset 0 3px 4px rgba(255,255,255,.65),inset 0 -5px 9px rgba(10,20,140,.4),0 8px 16px -4px var(--sh)}
.nav button,.foot button{border-radius:16px;padding:9px 12px;font-weight:600}
.nav button:hover,.foot button:hover{background:var(--hov)}
.nav button[aria-current="page"],.foot button[aria-current="page"]{color:var(--accent);background:linear-gradient(150deg,var(--glass-a),var(--glass-b));box-shadow:inset 0 2px 0 var(--hi),0 8px 16px -8px var(--sh)}

/* Neumorphic controls */
.btn{border:0;border-radius:18px;padding:10px 18px;font-weight:500;background:linear-gradient(145deg,var(--glass-a),var(--glass-b));box-shadow:6px 6px 14px var(--neu-d),-6px -6px 14px var(--neu-l),inset 0 1px 0 var(--hi)}
.btn:hover{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));transform:translateY(-2px)}
.btn:active{transform:scale(.95);box-shadow:inset 4px 4px 9px var(--neu-d),inset -4px -4px 9px var(--neu-l)}
.btn.sq{padding:10px;border-radius:16px}
.search,.bar select,.db input,.db select,.db textarea,.cf input{border:0;background:var(--field);border-radius:18px;box-shadow:inset 4px 4px 9px var(--neu-d),inset -4px -4px 9px var(--neu-l)}
.search{padding:10px 16px}.bar select{padding:10px 14px;font-weight:600}
.search:focus-within,.db input:focus,.db select:focus,.db textarea:focus,.cf input:focus{box-shadow:inset 4px 4px 9px var(--neu-d),inset -4px -4px 9px var(--neu-l),0 0 0 3px var(--soft)}
.db input:focus,.db select:focus,.db textarea:focus{background:var(--field)}
.seg{border:0;border-radius:18px;padding:4px;gap:2px;background:var(--field);box-shadow:inset 4px 4px 9px var(--neu-d),inset -4px -4px 9px var(--neu-l)}
.seg button{border-radius:14px;background:none;padding:8px 12px}
.seg button[aria-pressed="true"]{color:var(--accent);background:linear-gradient(145deg,var(--glass-a),var(--glass-b));box-shadow:3px 3px 8px var(--neu-d),inset 0 1px 0 var(--hi)}

/* Clay primary: puffy, lit from above */
.btn.pri{color:#fff;background:linear-gradient(160deg,#8190FF,#4254EE);box-shadow:0 12px 22px -8px rgba(66,84,238,.7),inset 0 3px 3px rgba(255,255,255,.55),inset 0 -6px 10px rgba(14,24,150,.4)}
.btn.pri:hover{background:linear-gradient(160deg,#8D9BFF,#4A5BF2);filter:none}
.btn.pri:active{box-shadow:inset 0 4px 10px rgba(14,24,150,.5)}

/* Clay + liquid-glass surfaces */
.kpi,.card,.stages div,.tbl,.empty,.prop,.note{position:relative;background:linear-gradient(150deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line)}
.kpi::before,.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%)}
:root[data-theme="dark"] .kpi::before,:root[data-theme="dark"] .card::before{opacity:.35}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi::before,:root:not([data-theme="light"]) .card::before{opacity:.35}}
.kpis{background:none;border:0;border-radius:0;gap:16px;margin-bottom:18px}
.kpis .kpi{border:1px solid var(--line)!important;border-radius:var(--r);padding:18px 20px;box-shadow:0 18px 32px -16px var(--sh),inset 0 2px 0 var(--hi),inset 0 -10px 18px var(--soft)}
.kpi:nth-child(1){background:linear-gradient(150deg,rgba(91,108,255,.3),transparent 75%),linear-gradient(150deg,var(--glass-a),var(--glass-b))}
.kpi:nth-child(2){background:linear-gradient(150deg,rgba(62,214,165,.34),transparent 75%),linear-gradient(150deg,var(--glass-a),var(--glass-b))}

["Planning",[["business-plans","Business Plans"],["business-models","Business Models"],["financial-planning","Financial Planning"],["product-planning","Product Planning"],["market-strategy","Market Strategy"],["risk-register","Risk Register"]]],

const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};

function applyTheme(t){curTheme=t;try{localStorage.setItem(KEY.t,t)}catch(e){}t==="system"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",t)}
applyTheme(curTheme);

const icon=n=>`<svg><use href="#i-${n}"/></svg>`;
const tag=(t,c="")=>`<span class="tag ${c}">${esc(t)}</span>`;
const label=id=>[...NAV.flatMap(g=>g[1]),...BOTTOM].find(x=>x[0]===id)?.[1]||"Overview";
const tone=s=>({Active:"ok",Launched:"ok","Under Evaluation":"warn","Needs Attention":"bad"}[s]||"");
const ptone=p=>({Critical:"bad",High:"warn"}[p]||"");
const vName=id=>D.ventures.find(v=>v.id===id)?.name||"";
const opt=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
const money=n=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:D.profile.cur,maximumFractionDigits:0}).format(+n||0)}catch(e){return String(+n||0)}};
const fmtDate=d=>{try{return new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}};
const isOver=(i,m)=>m.done&&i.date&&i.date<today&&i.status!==m.done;
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2800)}
function armed(b,fn){if(b.dataset.arm){fn();return}b.dataset.arm=1;const o=b.innerHTML;b.classList.add("danger");b.textContent="Sure?";setTimeout(()=>{if(b.isConnected&&b.dataset.arm){delete b.dataset.arm;b.classList.remove("danger");b.innerHTML=o}},3000)}
const head=(t,p,a="")=>`<div class="head"><div><h1>${t}</h1><p>${p}</p></div><div class="acts">${a}</div></div>`;
const emptyBox=(h,p,btn)=>`<div class="empty"><h3>${h}</h3><p>${p}</p>${btn}</div>`;
const emptyV=()=>emptyBox("No ventures yet","Create your first venture to track its stage, status and progress.",`<button class="btn pri" data-new>${icon("plus")}Create venture</button>`);
const vSel=()=>`<select data-f="v" aria-label="Venture"><option value="">All ventures</option>${D.ventures.map(v=>`<option value="${v.id}" ${F.v===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select>`;
const searchBox=()=>`<label class="search">${icon("search")}<input data-f="q" value="${esc(F.q)}" placeholder="Search" aria-label="Search"></label>`;
const refresh=()=>{if(curBody&&$("#lst"))$("#lst").innerHTML=curBody()};

function drawNav(){
  $("#nav").innerHTML=NAV.map(([g,items],gi)=>`<h6>${g}</h6>`+items.map(([id,l])=>`<button data-nav="${id}" ${!sel&&id===nav?'aria-current="page"':""}><svg style="color:${GC[gi]};fill:currentColor;stroke:none"><use href="#i-dot"/></svg>${l}</button>`).join("")).join("");
  $("#foot").innerHTML=BOTTOM.map(([id,l])=>`<button data-nav="${id}" ${!sel&&id===nav?'aria-current="page"':""}>${icon("dot")}${l}</button>`).join("");
}
function go(id,fv=""){nav=id;sel=null;F={q:"",stage:"",status:"",pri:"",v:fv};render();closeMenu();$("main").scrollTop=0}
function closeMenu(){$("#side").classList.remove("open");$("#scrim").classList.remove("open")}
function render(){
  drawNav();
  $("#avBtn").textContent=(D.profile.name.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase())||"?";
  document.querySelector(".brand small").textContent=D.profile.workspace||"Venture Studio";
  let x=sel&&D.ventures.find(z=>z.id===sel);if(sel&&!x)sel=null;
  $("#crumb").textContent=x?x.name:label(nav);
  $("#view").innerHTML=x?ventureView(x):page(nav);
}
function page(id){
  if(id==="overview"||id==="all-ventures")return homePage(id);
  if(id==="venture-pipeline")return pipeline();
  if(id==="reports-analytics")return reports();
  if(id==="settings")return settings();
  if(id==="profile")return profilePage();
  if(id==="help")return helpPage();
  return modPage(id);
}

/* ---------- Ventures: overview, pipeline, detail ---------- */
function filtered(){
  const s=F.q.toLowerCase();
  return D.ventures.filter(v=>(!s||(v.name+v.category+v.owner+v.description).toLowerCase().includes(s))&&(!F.stage||v.stage===F.stage)&&(!F.status||v.status===F.status)&&(!F.pri||v.priority===F.pri)).sort((a,b)=>(b.updated||0)-(a.updated||0));
}
function ventureBody(){
  const list=filtered();
  if(!list.length)return emptyBox("No ventures match","Clear the search or change a filter to see your portfolio again.","");
  if(mode==="grid")return `<div class="grid">${list.map(x=>`<button class="card" data-open="${x.id}"><h3>${esc(x.name)}</h3>${x.description?`<p>${esc(x.description)}</p>`:""}
    <div class="meta">${tag(x.status,tone(x.status))}${tag(x.stage)}${tag(x.priority,ptone(x.priority))}</div>
    <div class="prog" role="progressbar" aria-valuenow="${+x.progress||0}" aria-valuemin="0" aria-valuemax="100"><i style="width:${+x.progress||0}%"></i></div>
    <div class="row"><span>${esc(x.owner||"No owner")}</span><span>${+x.progress||0}%</span></div></button>`).join("")}</div>`;
  return `<div class="tbl"><table><thead><tr><th>Venture</th><th>Category</th><th>Stage</th><th>Status</th><th>Progress</th><th>Priority</th><th>Owner</th></tr></thead><tbody>${list.map(x=>`<tr data-open="${x.id}"><td><b>${esc(x.name)}</b></td><td>${esc(x.category||"–")}</td><td>${esc(x.stage)}</td><td>${tag(x.status,tone(x.status))}</td><td>${+x.progress||0}%</td><td>${tag(x.priority,ptone(x.priority))}</td><td>${esc(x.owner||"–")}</td></tr>`).join("")}</tbody></table></div>`;
}
function homePage(id){
  const live=D.ventures.filter(x=>x.status!=="Draft");
  const ideas=D.items.filter(i=>i.kind==="idea"&&(i.status==="Under Evaluation"||i.status==="Promising")).length;
  const k=[["Total ventures",live.length],["Active ventures",live.filter(x=>x.status==="Active").length],["Ideas under evaluation",ideas+live.filter(x=>x.status==="Under Evaluation").length],["In development",live.filter(x=>x.stage==="Development").length],["Launched",live.filter(x=>x.status==="Launched"||x.stage==="Launch"||x.stage==="Growth").length],["Need attention",live.filter(x=>x.status==="Needs Attention"||x.priority==="Critical").length+D.items.filter(i=>i.kind==="risk"&&i.status!=="Closed"&&(i.pri==="High"||i.pri==="Critical")).length]];
  curBody=ventureBody;
  const h=head(id==="all-ventures"?"All ventures":"Venture Studio","Create, research, plan and scale ventures across their lifecycle.",`<button class="btn" data-add="idea-lab">${icon("plus")}Capture idea</button><button class="btn pri" data-new>${icon("plus")}Create venture</button>`);
  const kp=`<section class="kpis" aria-label="Portfolio indicators">${k.map(([l,n],i)=>`<div class="kpi ${i===5&&n?"alert":""}"><span>${l}</span><b>${n}</b></div>`).join("")}</section>
    <section class="stages" aria-label="Ventures by stage">${STAGES.map(s=>`<div>${s}<b>${live.filter(x=>x.stage===s).length}</b></div>`).join("")}</section>`;
  if(!D.ventures.length)return h+kp+emptyV();
  return h+kp+`<div class="bar">${searchBox()}<select data-f="stage" aria-label="Stage"><option value="">All stages</option>${opt(STAGES,F.stage)}</select><select data-f="status" aria-label="Status"><option value="">All statuses</option>${opt(STATUSES,F.status)}</select><select data-f="pri" aria-label="Priority"><option value="">All priorities</option>${opt(PR,F.pri)}</select>
    <div class="seg" role="group" aria-label="View"><button data-mode="grid" aria-pressed="${mode==="grid"}" aria-label="Card view">${icon("grid")}</button><button data-mode="table" aria-pressed="${mode==="table"}" aria-label="Table view">${icon("list")}</button></div></div><div id="lst">${ventureBody()}</div>`;
}
function pipeline(){
  curBody=()=>`<div class="board">${STAGES.map(s=>{const l=D.ventures.filter(v=>v.stage===s&&(!F.q||v.name.toLowerCase().includes(F.q.toLowerCase())));
    return `<div class="bc"><h3>${s}${tag(l.length)}</h3>${l.map(v=>`<div class="rec"><div class="rb"><button class="lk" data-open="${v.id}"><b>${esc(v.name)}</b></button><div class="meta">${tag(v.status,tone(v.status))}${tag(v.priority,ptone(v.priority))}</div></div><div class="ra"><select data-vstage="${v.id}" aria-label="Move ${esc(v.name)} to stage">${opt(STAGES,v.stage)}</select></div></div>`).join("")||`<p class="mute" style="padding:6px">No ventures here.</p>`}</div>`}).join("")}</div>`;
  const h=head("Venture Pipeline","Move ventures through each stage of their lifecycle.",`<button class="btn pri" data-new>${icon("plus")}Create venture</button>`);
  return D.ventures.length?h+`<div class="bar">${searchBox()}</div><div id="lst">${curBody()}</div>`:h+emptyV();
}
function ventureView(v){
  const mine=D.items.filter(i=>i.venture===v.id),p=+v.progress||0;
  const sec=Object.entries(MODS).filter(([k])=>k!=="idea-lab").map(([k,m])=>{
    const l=mine.filter(i=>i.kind===m.kind),fk=m.bf||"status";
    return `<section class="pn"><div class="row2"><h3>${m.t} ${tag(l.length)}</h3><button class="btn" data-add="${k}" data-v="${v.id}" aria-label="Add ${m.s}">${icon("plus")}Add</button></div>
    ${l.slice(0,5).map(i=>`<button class="mini" data-edit="${i.id}"><span>${esc(i.title)}</span>${i[fk]?tag(i[fk]):""}</button>`).join("")||`<p class="mute">Nothing yet.</p>`}
    ${l.length>5?`<button class="lk mute" data-nav="${k}" data-fv="${v.id}">View all ${l.length}</button>`:""}</section>`}).join("");
  return `<div class="head"><div><button class="lk mute" data-back>Back to all ventures</button><h1>${esc(v.name)}</h1><p>${esc(v.description||v.category||"No description yet.")}</p></div>
    <div class="acts"><button class="btn" data-editv="${v.id}">${icon("edit")}Edit</button><button class="btn" data-delv="${v.id}">${icon("trash")}Delete</button></div></div>
  <div class="tiles"><label class="tile"><span>Stage</span><select data-vstage="${v.id}">${opt(STAGES,v.stage)}</select></label>
  <label class="tile"><span>Status</span><select data-vstatus="${v.id}">${opt(STATUSES,v.status)}</select></label>
  <label class="tile"><span>Progress</span><b id="pv">${p}%</b><input class="range" type="range" min="0" max="100" value="${p}" data-vprog="${v.id}"></label>
  <div class="tile"><span>Priority and owner</span><b>${esc(v.priority)}</b><p class="mute">${esc(v.owner||"No owner")}</p></div></div>
  <div class="cols2">${sec}</div>`;
}

/* ---------- Generic module pages ---------- */
function row(i){
  const m=MK[i.kind],fk=m.bf||"status",f=m.fields.find(x=>x[0]===fk);
  const chips=["pri","date","num","meta","status"].filter(k=>k!==fk&&i[k]!==undefined&&i[k]!=="").map(k=>k==="pri"?tag(i.pri,ptone(i.pri)):k==="date"?tag((isOver(i,m)?"Overdue: ":"")+fmtDate(i.date),isOver(i,m)?"bad":""):k==="num"?tag(money(i.num)):tag(i[k])).join("")+(vName(i.venture)?tag(vName(i.venture)):"");
  return `<div class="rec"><div class="rt">${m.done?`<input type="checkbox" class="ck" data-tg="${i.id}" ${i.status===m.done?"checked":""} aria-label="Mark done">`:""}
    <div class="rb"><b>${esc(i.title)}</b>${i.detail?`<p>${esc(i.detail)}</p>`:""}<div class="meta">${chips}</div></div></div>
    <div class="ra">${f?`<select data-st="${i.id}" data-fk="${fk}" aria-label="${esc(f[1])}">${opt(f[3],i[fk])}</select>`:""}${i.kind==="idea"&&i.status!=="Promoted"?`<button class="btn" data-promote="${i.id}">Make venture</button>`:""}
    <button class="btn sq" data-edit="${i.id}" aria-label="Edit">${icon("edit")}</button><button class="btn sq" data-del="${i.id}" aria-label="Delete">${icon("trash")}</button></div></div>`;
}
function modBody(id){
  const m=MODS[id],s=F.q.toLowerCase();
  let l=D.items.filter(i=>i.kind===m.kind&&(!F.v||i.venture===F.v)&&(!s||((i.title||"")+(i.detail||"")+(i.meta||"")).toLowerCase().includes(s)));
  l.sort((a,b)=>m.fields.some(f=>f[0]==="date")&&a.date&&b.date?a.date.localeCompare(b.date):(b.created||0)-(a.created||0));
  if(!l.length)return emptyBox(D.items.some(i=>i.kind===m.kind)?"Nothing matches":"No "+m.t.toLowerCase()+" yet",m.sub,`<button class="btn pri" data-add="${id}">${icon("plus")}Add ${m.s}</button>`);
  if(m.board){const bf=m.bf||"status",o=m.fields.find(f=>f[0]===bf)[3];
    return `<div class="board">${o.map(c=>{const g=l.filter(i=>i[bf]===c);return `<div class="bc"><h3>${c}${tag(g.length)}</h3>${g.map(row).join("")||`<p class="mute" style="padding:6px">Empty.</p>`}</div>`}).join("")}</div>`}
  return l.map(row).join("");
}
function modPage(id){
  const m=MODS[id];let tiles="";
  const all=D.items.filter(i=>i.kind===m.kind&&(!F.v||i.venture===F.v));
  if(m.sum==="fin"){const r=all.filter(i=>i.meta==="Revenue").reduce((a,i)=>a+(+i.num||0),0),c=all.filter(i=>i.meta==="Cost").reduce((a,i)=>a+(+i.num||0),0);
    tiles=`<div class="tiles"><div class="tile"><span>Revenue</span><b class="pos">${money(r)}</b></div><div class="tile"><span>Costs</span><b>${money(c)}</b></div><div class="tile"><span>Net</span><b class="${r-c<0?"neg":"pos"}">${money(r-c)}</b></div></div>`}
  if(m.sum==="launch"){const d=all.filter(i=>i.status==="Done").length,p=all.length?Math.round(d/all.length*100):0;
    tiles=`<div class="tiles"><div class="tile"><span>Launch readiness</span><b>${p}%</b><div class="prog" style="margin-top:10px"><i style="width:${p}%"></i></div><p class="mute" style="margin-top:6px">${d} of ${all.length} done</p></div></div>`}
  curBody=()=>modBody(id);
  return head(m.t,m.sub,`<button class="btn pri" data-add="${id}" ${F.v?`data-v="${F.v}"`:""}>${icon("plus")}Add ${m.s}</button>`)+tiles+`<div class="bar">${searchBox()}${D.ventures.length?vSel():""}</div><div id="lst">${curBody()}</div>`;
}

/* ---------- Reports, settings, profile, help ---------- */
const bars=r=>{const mx=Math.max(1,...r.map(x=>x[1]));return `<div class="bars">${r.map(([l,n])=>`<div class="br"><span>${esc(l)}</span><div class="prog"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join("")}</div>`};
function reports(){
  const V=D.ventures,I=D.items,by=(a,f,vals)=>vals.map(x=>[x,a.filter(z=>z[f]===x).length]);
  const tasks=I.filter(i=>i.kind==="task"),done=tasks.filter(i=>i.status==="Done").length;
  const risks=I.filter(i=>i.kind==="risk"&&i.status!=="Closed"),fin=I.filter(i=>i.kind==="fin");
  const rev=fin.filter(i=>i.meta==="Revenue").reduce((a,i)=>a+(+i.num||0),0),cost=fin.filter(i=>i.meta==="Cost").reduce((a,i)=>a+(+i.num||0),0);
  const t=(l,v,c="")=>`<div class="tile"><span>${l}</span><b class="${c}">${v}</b></div>`;
  return head("Reports and Analytics","A live summary of everything in your workspace.")+
  `<div class="tiles">${t("Ventures",V.length)}${t("Task completion",tasks.length?Math.round(done/tasks.length*100)+"%":"–")}${t("Open risks",risks.length,risks.length?"neg":"")}${t("Net position",money(rev-cost),rev-cost<0?"neg":"pos")}</div>
  <div class="cols2"><section class="pn"><h3>Ventures by stage</h3>${bars(by(V,"stage",STAGES))}</section>
  <section class="pn"><h3>Ventures by status</h3>${bars(by(V,"status",STATUSES))}</section>
  <section class="pn"><h3>Tasks by status</h3>${bars(by(tasks,"status",MODS["projects-tasks"].fields[4][3]))}</section>
  <section class="pn"><h3>Open risks by severity</h3>${bars(by(risks,"pri",PR))}</section>
  <section class="pn"><h3>Ideas by status</h3>${bars(by(I.filter(i=>i.kind==="idea"),"status",MODS["idea-lab"].fields[3][3]))}</section>
  <section class="pn"><h3>Revenue and costs</h3><div class="tiles" style="margin:0"><div class="tile"><span>Revenue</span><b class="pos">${money(rev)}</b></div><div class="tile"><span>Costs</span><b>${money(cost)}</b></div></div></section></div>`;
}
function settings(){
  const json=JSON.stringify({ventures:D.ventures,items:D.items,profile:D.profile},null,2);
  return head("Settings","Appearance and your workspace data.")+`<div class="cols2"><section class="pn"><h3>Appearance</h3><div class="db"><label class="full">Theme<select id="thsel">${["system","light","dark"].map(t=>`<option value="${t}" ${t===curTheme?"selected":""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select></label>
  <label class="full">Currency<select id="cursel">${["USD","INR","EUR","GBP"].map(c=>`<option ${c===D.profile.cur?"selected":""}>${c}</option>`).join("")}</select></label></div></section>
  <section class="pn"><h3>Your data</h3><p class="mute" style="margin-bottom:12px">Everything is stored in this browser. Copy this text to back up your workspace, or paste a backup here and import it.</p>
  <textarea id="dt" rows="8" class="ta" spellcheck="false" aria-label="Workspace data">${esc(json)}</textarea>
  <div class="acts" style="margin-top:12px;flex-wrap:wrap"><button class="btn" data-act="dl">Download file</button><button class="btn" data-act="imp">Import from text</button><button class="btn" data-act="reset">Reset workspace</button></div></section></div>`;
}
const profilePage=()=>head("User profile","How you appear in this workspace.")+`<section class="pn" style="max-width:600px"><div class="db"><label class="full">Name<input data-p="name" value="${esc(D.profile.name)}"></label><label>Role<input data-p="role" value="${esc(D.profile.role)}"></label><label>Workspace name<input data-p="workspace" value="${esc(D.profile.workspace)}"></label></div></section>`;
const helpPage=()=>head("Help","How the studio fits together.")+`<div class="cols2 help"><section class="pn"><h3>Get started</h3><ol><li>Create a venture, or capture an idea and promote it later.</li><li>Open the venture to add plans, tasks, risks, milestones and more.</li><li>Move it along the pipeline as it matures.</li><li>Check Reports and Analytics for the big picture.</li></ol></section>
  <section class="pn"><h3>Shortcuts</h3><ul><li><kbd>Ctrl</kbd> or <kbd>⌘</kbd> + <kbd>K</kbd> searches everything</li><li><kbd>Esc</kbd> closes menus, dialogs and Venture AI</li></ul></section>
  <section class="pn"><h3>Venture AI</h3><p>Venture AI runs on your own Ollama server. Open it from the top bar and test the connection. Its proposals stay pending until you approve them, and approving one creates a draft venture with its tasks and risks.</p></section>
  <section class="pn"><h3>Your data</h3><p>Everything is saved in this browser only. Use Settings to back it up or move it to another browser.</p></section></div>`;

/* ---------- Dialogs ---------- */
function fieldHtml(f,v){const [k,l,t,o]=f;
  if(t==="area")return `<label class="full">${l}<textarea name="${k}" rows="3">${esc(v)}</textarea></label>`;
  if(t==="sel")return `<label>${l}<select name="${k}">${opt(o,v)}</select></label>`;
  return `<label ${k==="title"?'class="full"':""}>${l}<input name="${k}" type="${t==="date"||t==="number"?t:"text"}" value="${esc(v)}" ${k==="title"?"required":""} ${t==="number"?'min="0" step="any"':""}></label>`}
function openItem(mid,item,pre={}){
  const m=MODS[mid],x=item||pre;
  $("#it").textContent=(item?"Edit ":"Add ")+m.s;$("#if").dataset.mod=mid;$("#if").dataset.id=item?.id||"";
  $("#ib").innerHTML=m.fields.map(f=>fieldHtml(f,x[f[0]])).join("")+`<label class="full">Venture<select name="venture"><option value="">Studio-wide</option>${D.ventures.map(v=>`<option value="${v.id}" ${x.venture===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></label>`;
  $("#idlg").showModal();$("#ib").querySelector("input,textarea")?.focus();
}
$("#if").addEventListener("submit",e=>{
  if(e.submitter?.value!=="save")return;
  const m=MODS[e.target.dataset.mod],d=Object.fromEntries(new FormData(e.target)),id=e.target.dataset.id;
  m.fields.forEach(f=>{if(f[2]==="number")d[f[0]]=d[f[0]]===""?"":+d[f[0]]});
  if(id)Object.assign(D.items.find(i=>i.id===id),d);else D.items.unshift({id:uid(),kind:m.kind,created:Date.now(),...d});
  save();render();toast(id?"Saved.":"Added "+m.s+".");
});
const vf=$("#vf");vf.elements.stage.innerHTML=opt(STAGES,"Ideation");vf.elements.status.innerHTML=opt(STATUSES,"Active");vf.elements.priority.innerHTML=opt(PR,"Medium");
function openV(v){vf.reset();$("#vt").textContent=v?"Edit venture":"Create venture";vf.elements.id.value=v?.id||"";
  if(v)["name","category","owner","stage","status","priority","progress","description"].forEach(k=>vf.elements[k].value=v[k]??"");
  $("#dlg").showModal();vf.elements.name.focus()}
vf.addEventListener("submit",e=>{
  if(e.submitter?.value!=="save")return;
  const d=Object.fromEntries(new FormData(vf));d.progress=Math.max(0,Math.min(100,+d.progress||0));const id=d.id;delete d.id;
  if(id){Object.assign(D.ventures.find(v=>v.id===id),d,{updated:Date.now()});toast("Venture updated.")}
  else{const v=addVenture(d);sel=null;toast("Venture saved.")}
  save();render();
});
function addVenture(d){const v={id:uid(),updated:Date.now(),...d};D.ventures.unshift(v);return v}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  if(!e.target.closest(".sw"))$("#sr").style.display="none";
  const t=e.target.closest("[data-nav],[data-new],[data-close],[data-mode],[data-open],[data-add],[data-edit],[data-del],[data-editv],[data-delv],[data-promote],[data-back],[data-act]");if(!t)return;
  const d=t.dataset;
  if(e.target.closest("#sr")){$("#sr").style.display="none";$("#gsearch").value=""}
  if(d.nav)go(d.nav,d.fv||"");
  else if("new" in d)openV();
  else if("close" in d)t.closest("dialog").close();
  else if(d.mode){mode=d.mode;render()}
  else if(d.open){sel=d.open;render();$("main").scrollTop=0}
  else if(d.add)openItem(d.add,null,d.v?{venture:d.v}:{});
  else if(d.edit){const i=D.items.find(z=>z.id===d.edit);if(i)openItem(MK[i.kind].id,i)}
  else if(d.del)armed(t,()=>{D.items=D.items.filter(i=>i.id!==d.del);save();render();toast("Deleted.")});
  else if(d.editv)openV(D.ventures.find(v=>v.id===d.editv));
  else if(d.delv)armed(t,()=>{D.ventures=D.ventures.filter(v=>v.id!==d.delv);D.items.forEach(i=>{if(i.venture===d.delv)i.venture=""});sel=null;nav="all-ventures";save();render();toast("Venture deleted. Its records are now studio-wide.")});
  else if(d.promote){const i=D.items.find(z=>z.id===d.promote);addVenture({name:i.title,description:i.detail||"",category:i.meta||"",stage:"Ideation",status:"Under Evaluation",priority:"Medium",progress:0,owner:""});i.status="Promoted";save();go("all-ventures");toast("Idea promoted to a venture.")}
  else if("back" in d)go("all-ventures");
  else if(d.act==="dl"){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("#dt").value],{type:"application/json"}));a.download="venture-studio-backup.json";a.click();toast("If nothing downloads, copy the text instead.")}catch(x){toast("Copy the text instead.")}}
  else if(d.act==="imp"){try{const j=JSON.parse($("#dt").value);if(!Array.isArray(j.ventures)||!Array.isArray(j.items))throw 0;D.ventures=j.ventures;D.items=j.items;if(j.profile)Object.assign(D.profile,j.profile);save();render();toast("Workspace imported.")}catch(x){toast("That text isn't a valid backup.")}}
  else if(d.act==="reset")armed(t,()=>{D.ventures=[];D.items=[];save();render();toast("Workspace reset.")});
});
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(d.f==="q"){F.q=t.value;refresh()}
  if(t.id==="gsearch")search(t.value);
  if(d.vprog){$("#pv").textContent=t.value+"%"}
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.f){F[d.f]=t.value;refresh()}
  if(d.st){D.items.find(z=>z.id===d.st)[d.fk]=t.value;save();render()}
  if(d.tg){const i=D.items.find(z=>z.id===d.tg),m=MK[i.kind];i.status=t.checked?m.done:m.fields.find(f=>f[0]==="status")[3][0];save();render()}
  if(d.vstage){D.ventures.find(v=>v.id===d.vstage).stage=t.value;touch(d.vstage);render()}
  if(d.vstatus){D.ventures.find(v=>v.id===d.vstatus).status=t.value;touch(d.vstatus);render()}
  if(d.vprog){D.ventures.find(v=>v.id===d.vprog).progress=+t.value;touch(d.vprog);toast("Progress saved.")}
  if(d.p){D.profile[d.p]=t.value;save();render()}
  if(t.id==="thsel")applyTheme(t.value);
  if(t.id==="cursel"){D.profile.cur=t.value;save()}
});
function touch(id){D.ventures.find(v=>v.id===id).updated=Date.now();save()}
function search(q){
  const s=q.trim().toLowerCase(),sr=$("#sr");if(!s){sr.style.display="none";return}
  const r=[...D.ventures.filter(v=>(v.name+v.category+v.description+v.owner).toLowerCase().includes(s)).map(v=>({t:v.name,k:"Venture",a:`data-open="${v.id}"`})),
    ...D.items.filter(i=>((i.title||"")+(i.detail||"")+(i.meta||"")).toLowerCase().includes(s)).map(i=>({t:i.title,k:MK[i.kind].t,a:`data-edit="${i.id}"`}))].slice(0,8);
  sr.innerHTML=r.length?r.map(x=>`<button ${x.a}><span>${esc(x.t)}</span>${tag(x.k)}</button>`).join(""):`<p class="mute" style="padding:10px">No matches.</p>`;sr.style.display="block";
}
$("#menuBtn").onclick=()=>{$("#side").classList.add("open");$("#scrim").classList.add("open")};
$("#scrim").onclick=closeMenu;
$("#avBtn").onclick=()=>go("profile");
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#gsearch").focus()}
  if(e.key==="Escape"){closeMenu();$("#cop").classList.remove("open");$("#sr").style.display="none"}
});

/* ---------- Venture AI (Ollama) ---------- */
const SUGG=["Structure this idea into a venture plan","List the riskiest assumptions in my portfolio","Draft validation experiments for a new idea"];
function copHome(){$("#msgs").innerHTML=`<div class="note" id="intro">Venture AI runs on your own Ollama server. Its proposals stay separate until you review and approve them.</div>`+SUGG.map(s=>`<button class="sug">${esc(s)}</button>`).join("")}
$("#copBtn").onclick=()=>{$("#cop").classList.add("open");$("#copIn").focus()};
$("#copClose").onclick=()=>$("#cop").classList.remove("open");
$("#msgs").addEventListener("click",e=>{
  const s=e.target.closest(".sug");if(s)propose(s.textContent);
  const a=e.target.closest("[data-approve]");
  if(a){const p=a.closest(".prop");let its=[],asm=[];try{its=JSON.parse(p.dataset.items||"[]");asm=JSON.parse(p.dataset.risks||"[]")}catch(x){}
    const v=addVenture({name:p.dataset.name,category:"To be defined",stage:"Ideation",status:"Draft",priority:"Medium",progress:0,owner:"",description:p.dataset.desc||"Created from an approved Venture AI proposal."});
    its.forEach(i=>D.items.unshift({id:uid(),kind:"task",created:Date.now(),title:i.title,detail:i.detail,pri:"Medium",status:"To do",venture:v.id}));
    asm.forEach(r=>D.items.unshift({id:uid(),kind:"risk",created:Date.now(),title:r,detail:"",pri:"Medium",status:"Open",venture:v.id}));
    save();p.querySelector(".acts").innerHTML=tag("Saved as a draft venture with "+its.length+" tasks and "+asm.length+" risks","ok");sel=v.id;render();toast("Draft venture created.")}
  const r=e.target.closest("[data-reject]");if(r)r.closest(".prop").querySelector(".acts").innerHTML=tag("Rejected","bad");
});
$("#copForm").addEventListener("submit",e=>{e.preventDefault();const i=$("#copIn");if(i.value.trim()){propose(i.value.trim());i.value=""}});
const OL={url:"http://localhost:11434",model:"llama3.2"};
try{OL.url=localStorage.getItem("ed_vs_ollama_url")||OL.url;OL.model=localStorage.getItem("ed_vs_ollama_model")||OL.model}catch(e){}
$("#olUrl").value=OL.url;$("#olModel").value=OL.model;
function olSave(){OL.url=$("#olUrl").value.trim().replace(/\/+$/,"")||"http://localhost:11434";OL.model=$("#olModel").value.trim()||"llama3.2";try{localStorage.setItem("ed_vs_ollama_url",OL.url);localStorage.setItem("ed_vs_ollama_model",OL.model)}catch(e){}}
$("#olUrl").addEventListener("change",olSave);$("#olModel").addEventListener("change",olSave);
function olStatus(t,c){const s=$("#olSt");s.textContent=t;s.className="tag "+(c||"")}
$("#olTest").onclick=async()=>{
  olSave();olStatus("Testing");
  try{const r=await fetch(OL.url+"/api/tags");if(!r.ok)throw new Error(r.status);
    const names=((await r.json()).models||[]).map(x=>x.name);
    $("#olModels").innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
    if(names.length&&!names.includes(OL.model)){$("#olModel").value=names[0];olSave();toast("Model set to "+names[0])}
    olStatus(names.length?names.length+" model"+(names.length>1?"s":"")+" found":"Connected, no models",names.length?"ok":"warn");
  }catch(e){olStatus("Can\u2019t connect","bad")}
};
const SCHEMA={type:"object",properties:{title:{type:"string"},summary:{type:"string"},items:{type:"array",items:{type:"object",properties:{title:{type:"string"},detail:{type:"string"}},required:["title","detail"]}},assumptions:{type:"array",items:{type:"string"}}},required:["title","summary","items","assumptions"]};
async function propose(text){
  if(propose.busy)return;propose.busy=true;
  const m=$("#msgs");if($("#intro"))m.innerHTML="";
  m.insertAdjacentHTML("beforeend",`<div class="me">${esc(text)}</div><div class="note" id="thinking">Venture AI is working on it\u2026</div>`);
  m.scrollTop=m.scrollHeight;olSave();
  const ctx=D.ventures.slice(0,12).map(v=>`${v.name} (${v.stage}, ${v.status})`).join("; ")||"none yet";
  try{
    const r=await fetch(OL.url+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:OL.model,stream:false,format:SCHEMA,
      messages:[{role:"system",content:"You are Venture AI inside EngineerDESK Venture Studio. Turn the request into a short proposal: a title, a two-sentence summary, 3 to 5 action items with details, and the assumptions that still need checking. Existing ventures: "+ctx},{role:"user",content:text}]})});
    if(!r.ok){const t=await r.text();throw new Error(r.status===404?`The model \u201c${OL.model}\u201d isn\u2019t installed. Run: ollama pull ${OL.model}`:`Ollama returned ${r.status}. ${t.slice(0,140)}`)}
    const p=JSON.parse((await r.json()).message.content);
    $("#thinking")?.remove();olStatus("Connected","ok");
    m.insertAdjacentHTML("beforeend",`<div class="prop" data-name="${esc(p.title)}" data-desc="${esc(p.summary)}" data-items="${esc(JSON.stringify(p.items||[]))}" data-risks="${esc(JSON.stringify(p.assumptions||[]))}"><span class="tag">Pending review</span><b>${esc(p.title)}</b><span>${esc(p.summary)}</span>
    <ul>${(p.items||[]).map(i=>`<li><b>${esc(i.title)}</b>: ${esc(i.detail)}</li>`).join("")}</ul>
    ${(p.assumptions||[]).length?`<div class="note">Needs checking: ${p.assumptions.map(esc).join("; ")}</div>`:""}
    <div class="acts"><button class="btn pri" data-approve>Save as draft venture</button><button class="btn" data-reject>Reject</button></div></div>`);
  }catch(e){
    $("#thinking")?.remove();olStatus("Can\u2019t connect","bad");
    const msg=e instanceof TypeError?`Can\u2019t reach Ollama at ${OL.url}. Check that Ollama is running, that OLLAMA_ORIGINS allows this page, and that you opened this page from a local file or localhost. A page hosted on claude.ai can\u2019t reach your computer.`:e.message;
    m.insertAdjacentHTML("beforeend",`<div class="note"><b>Venture AI couldn\u2019t answer.</b> ${esc(msg)}</div>`);
  }
  propose.busy=false;m.scrollTop=m.scrollHeight;
}
copHome();render();
</script>
</body>
